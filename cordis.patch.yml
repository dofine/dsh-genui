# dsh-genui-charts bundle for DeepSeek Harness (dsh).
# Inserted into the profile's composition when this bundle is installed
# (`dsh plugin --profile web add link:/path/to/dsh-genui-charts`). The plugin
# row resolves the package by name through the profile's node_modules; the
# node half teaches the model the ```dsh-ui fence (plus the echarts/flint
# chart nodes), the dshClient half registers the browser renderer via the
# fence-registry extension point.
- insert:
    - id: genui
      name: 'dsh-genui-charts'
